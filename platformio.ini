[platformio]
default_envs = lora32-usb
extra_configs = ota.local.ini

[env]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  adafruit/Adafruit SSD1306
  sandeepmistry/LoRa

; Initial installation over USB.
[env:lora32-usb]
upload_protocol = esptool
build_src_filter = +<reader.cpp> -<receiver.cpp>

; Subsequent updates over Wi-Fi. Supply the target with --upload-port.
[env:lora32-ota]
upload_protocol = espota
extra_scripts = post:ota_upload.py
build_src_filter = +<reader.cpp> -<receiver.cpp>

; A dedicated LoRa receiver connected to the PC by USB.
[env:lora32-receiver-usb]
upload_protocol = esptool
build_src_filter = +<receiver.cpp> -<reader.cpp>

[env:lora32-receiver-ota]
upload_protocol = espota
extra_scripts = post:ota_upload.py
build_src_filter = +<receiver.cpp> -<reader.cpp>
